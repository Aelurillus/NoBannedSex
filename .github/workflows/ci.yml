name: CPU CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: cpu-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/ci.txt
          python -m pip install -e '.[dev]'
      - name: Static checks
        run: |
          python -m ruff check .
          python -m compileall -q nobannedsex
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Unit and integration tests
        run: python -m pytest -q --junitxml=reports/junit.xml
      - name: CPU end-to-end acceptance
        run: bash scripts/cpu_acceptance.sh runs/ci
      - name: Upload test reports (no weights or training data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-reports-python-${{ matrix.python }}
          path: |
            reports/junit.xml
            runs/ci/raw/metrics.jsonl
            runs/ci/raw/run_config.json
            runs/ci/raw/evaluation.json
            runs/ci/raw/benchmark.json
            runs/ci/sharded/metrics.jsonl
          retention-days: 14
